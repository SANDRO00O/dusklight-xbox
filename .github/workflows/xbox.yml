name: Xbox (experimental)

# Manual only. All build logic lives in platforms/xbox/ci.ps1 so it can change without touching
# this file. See docs/xbox-port.md.
# Copy this file to .github/workflows/xbox.yml to enable it.
#
# Build cache: build/xbox-uwp-x64 (MSBuild objects, Rust target dir), build/ext (SDL3-uwp clone) and
# the cargo registry are restored from actions/cache and saved after every run, even a failed one.
# platforms/xbox/Cache-Mtimes.ps1 fixes file mtimes so MSBuild only rebuilds what changed.
# Use the no_cache input for a clean build, or bump CACHE_VERSION to drop every old cache.
#
# Artifacts: xbox-uwp-logs (logs + the installable package, small) and xbox-uwp-symbols (the large
# *.appxsym debug symbols, only needed to decode crash addresses).
on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Ignore the saved build cache (clean build; the result is saved as the new cache)'
        type: boolean
        default: false

env:
  CACHE_VERSION: v1

jobs:
  build-xbox-uwp:
    name: Xbox UWP x64 (configure + build)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust targets
        shell: pwsh
        run: |
          rustup toolchain install stable
          rustup target add x86_64-pc-windows-msvc

      # Key by compatibility boundaries, not the hosted-image patch number. VS/MSVC servicing
      # updates within the same generator and MSVC ABI can reuse the existing object files.
      # The exact SDK is included; CMake is keyed by major version. Cargo fingerprints rustc
      # itself, so a stable Rust update rebuilds Rust outputs without discarding the C++ cache.
      - name: Compute cache key
        id: cachekey
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.ComponentGroup.UWP.VC -property installationPath
          $vsVersion = & $vswhere -latest -products * -requires Microsoft.VisualStudio.ComponentGroup.UWP.VC -property installationVersion
          if (-not $vsPath -or -not $vsVersion) { throw 'Could not locate Visual Studio with the UWP C++ component group.' }
          $vsMajor = ($vsVersion.Trim() -split '\.')[0]

          $msvcRoot = Join-Path $vsPath 'VC\Tools\MSVC'
          $msvcVersion = Get-ChildItem -Path $msvcRoot -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $msvcVersion) { throw "No MSVC toolset found under $msvcRoot" }
          $msvcAbiMajor = ($msvcVersion.Name -split '\.')[0]

          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdkVersion = Get-ChildItem -Path $sdkRoot -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' -and (Test-Path (Join-Path $_.FullName 'um')) } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $sdkVersion) { throw "No Windows 10/11 SDK found under $sdkRoot" }

          $cmakeLine = cmake --version | Select-Object -First 1
          if ($cmakeLine -notmatch '^cmake version (\d+)\.') { throw "Could not determine CMake version: $cmakeLine" }
          $cmakeMajor = $Matches[1]

          $prefix = "xbox-uwp-$($env:CACHE_VERSION)-vs$vsMajor-msvc$msvcAbiMajor-sdk$($sdkVersion.Name)-cmake$cmakeMajor-"
          "prefix=$prefix" >> $env:GITHUB_OUTPUT

          # One-time bridge to the last known-good cache (run #37). Only allow it while
          # the same VS/ABI/SDK/CMake compatibility family is present.
          if ($vsMajor -eq '18' -and $msvcAbiMajor -eq '14' -and $sdkVersion.Name -eq '10.0.26100.0' -and $cmakeMajor -eq '4') {
            'legacy_prefix=xbox-uwp-v1-20261103.298.1-' >> $env:GITHUB_OUTPUT
          } else {
            'legacy_prefix=' >> $env:GITHUB_OUTPUT
          }
          Write-Host "Cache key: $prefix"
          Write-Host "Visual Studio $vsVersion; MSVC toolset $($msvcVersion.Name); Windows SDK $($sdkVersion.Name); $cmakeLine"

      - name: Restore build cache
        if: ${{ !inputs.no_cache }}
        uses: actions/cache/restore@v4
        with:
          path: |
            build/xbox-uwp-x64
            build/ext
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cachekey.outputs.prefix }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.cachekey.outputs.prefix }}
            ${{ steps.cachekey.outputs.legacy_prefix }}

      - name: Configure and build
        shell: pwsh
        run: ./platforms/xbox/ci.ps1

      - name: Save build cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: |
            build/xbox-uwp-x64
            build/ext
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cachekey.outputs.prefix }}${{ github.run_id }}

      # Logs and the installable package, WITHOUT the big debug symbols (they go to the next step).
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xbox-uwp-logs
          path: |
            configure.log
            build.log
            patches.log
            cache-restore.log
            sdl-clone.log
            vswhere.log
            build/xbox-uwp-x64/CMakeFiles/CMakeConfigureLog.yaml
            build/xbox-uwp-x64/Assets/
            !**/*.appxsym
          if-no-files-found: ignore

      # Debug symbols (*.appxsym is already a zip, so no extra compression). Download this artifact
      # only when a crash address has to be decoded.
      - name: Upload symbols
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xbox-uwp-symbols
          path: build/xbox-uwp-x64/Assets/_package/**/*.appxsym
          compression-level: 0
          if-no-files-found: ignore
